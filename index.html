// 단체 게임
const GAME = {
  name: "훈민정음 윷놀이",
  videoUrl: "https://youtu.be/kMYIja9m-no?si=4jt5s5ZB3JMKnWyr",
  rules: [
    "<b>영어·외래어를 쓰면</b> 윷판에 올라가 있는 말이 <b>바로 아웃</b>됩니다.",
    "계속 아웃되면 게임 진행이 안 되기 때문에, 중간중간 <b>방어권을 줄 수 있는 미니게임</b>이 진행될 예정이니 참고 바랍니다!",
    "진행하는 MC가 모든 말을 다 들을 수 없어요 ㅠㅠ<br><b>MC : 전시안 (특징 : 잘 안들림)</b><br>그러니 이기기 위해 상대팀이 외래어·영어를 쓰는지 잘 확인하여 <b>MC에게 고발</b>해주시면 됩니다 :)",
  ],
  penalty: "패배한 팀이 승자 팀의 식비 정산에서 <b>인당 2,000원</b>씩 부담<br><span class=\"pnote\">아이스크림 사오기보다 나을 것 같습니다 (너무 더워요 🥵)</span>",
  teams: [
    { tag:"A팀", members:["이령서","양여명","라현철","한승아","양충근"] },
    { tag:"B팀", members:["김동규","온승찬","홍주연","이윤서","한정우"] },
  ],
};

/* ============================================================
   ⬆️⬆️⬆️  수정 끝  ⬆️⬆️⬆️
   ============================================================ */

const DOW_KR=["일","월","화","수","목","금","토"];
const pad=n=>String(n).padStart(2,"0");
const dt=(d,t)=>new Date(`${d}T${(t||"00:00")}:00`);
const tel=p=>"tel:"+p.replace(/[^0-9]/g,"");

const start=dt(EVENT.date,EVENT.startTime);
// 종료는 익일 오전
const end=new Date(dt(EVENT.date,EVENT.endTime).getTime()+86400e3);
const day=start.getDay();

// 팀 배정 안 된 참여자 자동 계산
const allPeople=[...LEADERSHIP.map(s=>s.name),...MEMBERS];
const assigned=new Set(GAME.teams.flatMap(t=>t.members));
const unassigned=allPeople.filter(n=>!assigned.has(n));

function dayBadge(){
  const t=new Date(), a=new Date(EVENT.date+"T00:00:00");
  const diff=Math.round((a-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400e3);
  if(diff===0) return '<span class="dbadge">오늘</span>';
  if(diff===1) return '<span class="dbadge">내일</span>';
  if(diff>1) return `<span class="dbadge">D-${diff}</span>`;
  return '';
}

function renderHero(){
  document.getElementById("heroSlot").innerHTML=`
  <div class="next-card">
    <div class="deco"></div><div class="deco2"></div>
    <div class="next-top">
      <div class="next-date">
        <div class="d">${pad(start.getMonth()+1)}.${pad(start.getDate())}</div>
        <div class="dow"><span class="kr">${DOW_KR[day]}요일</span>${dayBadge()}</div>
      </div>
      <div class="mt-emoji">🏠</div>
    </div>
    <div class="next-place">
      <div class="name">NEW ROUND MT</div>
      <div class="sub">📍 ${EVENT.place} · 백제고분로 455 6층 옥탑</div>
    </div>
    <div class="facts">
      <div class="fact"><div class="k">시작</div><div class="v">${EVENT.startTime}<small> 오후 7시</small></div></div>
      <div class="fact"><div class="k">종료</div><div class="v">${EVENT.endTime}<small> 익일 오전</small></div></div>
    </div>
    <div class="countdown"><div class="lbl" id="cdLbl">시작까지</div><div id="cdBody"></div></div>
    <div class="next-actions">
      <a class="btn btn-primary" target="_blank" rel="noopener" href="${EVENT.mapUrl}">📍 길찾기</a>
      <a class="btn btn-ghost" href="#contact">📞 문의</a>
    </div>
  </div>`;
  tick();
}

let timer;
function tick(){
  const body=document.getElementById("cdBody"); if(!body) return;
  const now=new Date(), diff=start-now;
  if(diff<=0){
    const live=now<=end;
    document.getElementById("cdLbl").textContent=live?"진행 중":"";
    body.innerHTML=live
      ? '<div class="cd-live"><span class="pulse"></span>MT 진행 중 🎉</div>'
      : '<div class="cd-live">MT 종료 · 수고하셨습니다 🎉</div>';
    if(!live) clearInterval(timer);
    return;
  }
  const d=Math.floor(diff/86400e3),h=Math.floor(diff%86400e3/3600e3),m=Math.floor(diff%3600e3/60e3),s=Math.floor(diff%60e3/1e3);
  body.innerHTML=`<div class="cd-grid">
    <div class="cd-cell"><div class="v">${d}</div><div class="u">DAYS</div></div>
    <div class="cd-cell"><div class="v">${pad(h)}</div><div class="u">HRS</div></div>
    <div class="cd-cell"><div class="v">${pad(m)}</div><div class="u">MIN</div></div>
    <div class="cd-cell"><div class="v">${pad(s)}</div><div class="u">SEC</div></div>
  </div>`;
}

function renderPlace(){
  document.getElementById("placeCard").innerHTML=`
    <div class="irow"><div class="ic">📍</div><div class="body">
      <div class="k">주소</div><div class="v">${EVENT.address}</div>
      <a class="maplink" target="_blank" rel="noopener" href="${EVENT.mapUrl}">지도에서 보기 ↗</a>
    </div></div>
    <div class="irow"><div class="ic">🕖</div><div class="body">
      <div class="k">시간</div><div class="v">오후 7시 ~ 익일 오전 9시</div>
      <div class="d">${EVENT.startTime} – ${EVENT.endTime} (다음날 아침까지)</div>
    </div></div>`;
}

function renderArrival(){
  document.getElementById("arrGrid").innerHTML=`
    <div class="arr prep">
      <div class="top"><span class="emo">🧰</span><span class="who">MT 준비 멤버</span></div>
      <div class="time">${EVENT.prepTime}</div>
      <div class="note">오후 6시 40분까지 도착</div>
    </div>
    <div class="arr">
      <div class="top"><span class="emo">🙌</span><span class="who">그 외 멤버</span></div>
      <div class="time">${EVENT.arriveTime}</div>
      <div class="note">오후 7시까지 방문</div>
    </div>`;
}

const chipCloud=arr=>`<div class="chips">${arr.map(n=>`<span class="chip">${n}</span>`).join("")}</div>`;

function renderTimeline(){
  document.getElementById("timeline").innerHTML=TIMELINE.map(r=>`
    <div class="tl ${r.lead?'lead':''}">
      <div class="t">${r.time}</div><div class="dot"></div>
      <div class="c"><div class="ti">${r.title}</div><div class="de">${r.desc||""}</div></div>
    </div>`).join("");

  document.getElementById("prepSlot").innerHTML=`
    <div class="prep-card">
      <div class="ph">
        <span class="pe">🧰</span>
        <span class="pn">MT 준비 멤버</span>
        <span class="pt">${PREP_MEMBERS.length}명 · ${EVENT.prepTime}</span>
      </div>
      ${chipCloud(PREP_MEMBERS)}
    </div>`;
}

function renderCrew(){
  const total=LEADERSHIP.length+MEMBERS.length;
  document.getElementById("crewSlot").innerHTML=`
    <div class="mgroup">
      <div class="mg-head"><span class="h">운영진</span><span class="cnt">${LEADERSHIP.length}명</span></div>
      <div class="staff-grid">${LEADERSHIP.map(s=>`
        <div class="staff"><div class="ava">${s.name.slice(0,1)}</div>
          <div><div class="nm">${s.name}</div><div class="rl">${s.role}</div></div></div>`).join("")}</div>
    </div>
    <div class="mgroup">
      <div class="mg-head"><span class="h">참여 멤버</span><span class="cnt">${MEMBERS.length}명</span></div>
      ${chipCloud(MEMBERS)}
    </div>
    <div class="mgroup">
      <div class="mg-head"><span class="h">총 참여</span><span class="cnt">${total}명</span></div>
    </div>`;
}

function renderGame(){
  const teamHTML=GAME.teams.map((t,i)=>`
    <div class="team ${i===0?'a':'b'}">
      <div class="th"><span class="tag">${t.tag}</span><span class="cnt">${t.members.length}명</span></div>
      ${chipCloud(t.members)}
    </div>`).join('<div class="vs-mid"><span class="ln"></span><span class="vs">VS</span><span class="ln"></span></div>');

  const un=unassigned.length
    ? `<div class="unassigned">팀 미배정 · ${unassigned.join(" · ")}</div>` : "";

  const rulesHTML=(GAME.rules&&GAME.rules.length)
    ? `<div class="rules">
         <div class="rh"><span class="re">📌</span><span class="rn">게임 규칙</span></div>
         ${GAME.rules.map(r=>`<div class="rule"><div class="rd"></div><div class="rt">${r}</div></div>`).join("")}
       </div>` : "";

  document.getElementById("gameSlot").innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div class="irow"><div class="ic">🎲</div><div class="body">
        <div class="k">Game</div><div class="v">${GAME.name}</div>
        <div class="d">20:30 – 21:00 진행 · 아래 영상으로 규칙 확인 후 시작합니다.</div>
      </div></div>
    </div>
    ${rulesHTML}
    <div style="height:14px"></div>
    <a class="gamebtn" target="_blank" rel="noopener" href="${GAME.videoUrl}">▶️ 게임 규칙 영상 보기</a>
    <div style="height:14px"></div>
    <div class="vs-wrap">${teamHTML}</div>
    ${un}
    <div class="penalty">
      <div class="pi">💸</div>
      <div class="pt">${GAME.penalty}</div>
    </div>`;
}

function renderContact(){
  const chat=EVENT.groupChatUrl
    ? `<a class="maplink" target="_blank" rel="noopener" href="${EVENT.groupChatUrl}">단톡방 열기 ↗</a>` : "";
  document.getElementById("contactCard").innerHTML=`
    <div class="irow"><div class="ic">💬</div><div class="body">
      <div class="k">일반 문의</div><div class="v lite">단톡방에 남겨주세요</div>
      <div class="d">일정 변경, 위치 확인 등 궁금한 점은 단톡방에 올려주시면 됩니다.</div>${chat}
    </div></div>
    <div class="irow"><div class="ic">📞</div><div class="body">
      <div class="k">급하거나 확인이 필요할 때</div><div class="v lite">${EVENT.contactName}</div>
      <a class="tel-btn" href="${tel(EVENT.contactPhone)}"><span>📞</span><span class="num">${EVENT.contactPhone}</span></a>
    </div></div>`;
}

renderHero(); renderPlace(); renderArrival(); renderTimeline(); renderCrew(); renderGame(); renderContact();
const _t=new Date();
document.getElementById("updated").textContent=`최종 업데이트 ${_t.getFullYear()}.${pad(_t.getMonth()+1)}.${pad(_t.getDate())}`;
timer=setInterval(tick,1000);
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener("click",e=>{const el=document.querySelector(a.getAttribute("href"));if(el){e.preventDefault();el.scrollIntoView({behavior:"smooth",block:"start"});}});
});
</script>
</body>
</html>
